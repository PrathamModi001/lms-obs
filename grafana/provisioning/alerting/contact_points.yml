apiVersion: 1

contactPoints:
  - orgId: 1
    name: default-alerts
    receivers:
      - uid: webhook-default
        type: webhook
        settings:
          url: http://host.docker.internal:3000/v1/observability/alerts/grafana-webhook
          httpMethod: POST
        disableResolveMessage: false

  # Critical: backend-down, fatal errors, high 5xx — webhook + email
  - orgId: 1
    name: critical-alerts
    receivers:
      - uid: webhook-critical
        type: webhook
        settings:
          url: http://host.docker.internal:3000/v1/observability/alerts/grafana-webhook
          httpMethod: POST
        disableResolveMessage: false
      - uid: email-critical
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: true
        disableResolveMessage: false

  # Warning: memory, event loop, response time, queue, email failures — webhook only
  - orgId: 1
    name: warning-alerts
    receivers:
      - uid: webhook-warning
        type: webhook
        settings:
          url: http://host.docker.internal:3000/v1/observability/alerts/grafana-webhook
          httpMethod: POST
        disableResolveMessage: false
