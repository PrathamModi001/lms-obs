# =============================================================================
# Grafana Alerting Provisioning - Contact Points
# =============================================================================

apiVersion: 1

contactPoints:
  # Default — catches anything not matched by specific routes
  - orgId: 1
    name: default-alerts
    receivers:
      - uid: webhook-default
        type: webhook
        settings:
          url: http://host.docker.internal:3000/v1/observability/alerts/grafana-webhook
          httpMethod: POST
        disableResolveMessage: false

  # Critical — fatal errors, backend down, event loop blocked
  # Add email receiver here for on-call escalation
  - orgId: 1
    name: critical-alerts
    receivers:
      - uid: webhook-critical
        type: webhook
        settings:
          url: http://host.docker.internal:3000/v1/observability/alerts/grafana-webhook
          httpMethod: POST
        disableResolveMessage: false
      # Uncomment and configure for email escalation:
      # - uid: email-critical
      #   type: email
      #   settings:
      #     addresses: oncall@yourdomain.com
      #     singleEmail: false
      #   disableResolveMessage: false

  # Warning — degraded performance, queue failures, email failures
  - orgId: 1
    name: warning-alerts
    receivers:
      - uid: webhook-warning
        type: webhook
        settings:
          url: http://host.docker.internal:3000/v1/observability/alerts/grafana-webhook
          httpMethod: POST
        disableResolveMessage: false
