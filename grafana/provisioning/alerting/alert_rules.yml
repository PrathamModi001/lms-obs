apiVersion: 1

groups:
  - orgId: 1
    name: LMS Infrastructure
    folder: LMS Alerts
    interval: 1m
    rules:
      # Backend Down — noDataState: Alerting because up=0 means scrape failed = backend down
      - uid: backend-down-grafana
        title: Backend Service Down
        condition: C
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="lms-backend"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: B
              refId: C
              type: threshold
        for: 1m
        labels:
          severity: critical
          category: infrastructure
          service: lms-backend
        annotations:
          summary: LMS Backend service is DOWN
          description: Backend unreachable for > 1 minute

      - uid: high-memory-grafana
        title: High Memory Usage (RSS > 700MB)
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: nodejs_resident_memory_bytes / 1024 / 1024
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [700], type: gt }
              expression: B
              refId: C
              type: threshold
        for: 5m
        labels:
          severity: warning
          category: infrastructure
          service: lms-backend
        annotations:
          summary: High memory usage detected
          description: Node.js RSS has exceeded 700MB for 5 minutes

      # Downgraded to warning — no email, just webhook
      - uid: event-loop-lag-grafana
        title: Event Loop Lag > 500ms
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(nodejs_event_loop_lag_ms_bucket[5m])) by (le))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [500], type: gt }
              expression: B
              refId: C
              type: threshold
        for: 2m
        labels:
          severity: warning
          category: infrastructure
          service: lms-backend
        annotations:
          summary: Node.js event loop is blocked
          description: P95 event loop lag > 500ms — server likely unresponsive or under extreme load

  - orgId: 1
    name: LMS Application Performance
    folder: LMS Alerts
    interval: 1m
    rules:
      - uid: high-error-rate-grafana
        title: High HTTP 5xx Error Rate (5%+)
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: |
                (sum(rate(http_server_request_duration_count{http_status_code=~"5.."}[5m]))
                / sum(rate(http_server_request_duration_count[5m]))) * 100
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [5], type: gt }
              expression: B
              refId: C
              type: threshold
        for: 3m
        labels:
          severity: critical
          category: application
          service: lms-backend
        annotations:
          summary: High 5xx error rate
          description: HTTP 5xx rate > 5% for 3 minutes

      - uid: high-response-time-grafana
        title: High Response Time (P95 > 2s)
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_bucket[5m])) by (le))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [2000], type: gt }
              expression: B
              refId: C
              type: threshold
        for: 5m
        labels:
          severity: warning
          category: application
          service: lms-backend
        annotations:
          summary: High P95 response time
          description: P95 latency > 2s for 5 minutes

      - uid: fatal-errors-grafana
        title: Fatal Application Error
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(increase(app_errors_total{severity="fatal"}[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
              expression: B
              refId: C
              type: threshold
        for: 0s
        labels:
          severity: critical
          category: application
          service: lms-backend
        annotations:
          summary: Fatal error / process crash detected
          description: One or more fatal events (uncaughtException/unhandledRejection) in the last 5 minutes

      - uid: app-error-spike-grafana
        title: Application Error Spike (>10 errors/min)
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rate(app_errors_total{severity="error"}[1m])) * 60
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [10], type: gt }
              expression: B
              refId: C
              type: threshold
        for: 2m
        labels:
          severity: warning
          category: application
          service: lms-backend
        annotations:
          summary: Application error rate spike
          description: More than 10 server errors per minute for 2 minutes

      - uid: queue-failures-grafana
        title: Queue Job Failures Spike
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(increase(queue_jobs_failed_total[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [5], type: gt }
              expression: B
              refId: C
              type: threshold
        for: 1m
        labels:
          severity: warning
          category: application
          service: lms-backend
        annotations:
          summary: Queue job failures detected
          description: More than 5 queue job failures in the last 5 minutes

      - uid: email-failures-grafana
        title: Email Delivery Failures
        condition: C
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(increase(emails_failed_total[10m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [3], type: gt }
              expression: B
              refId: C
              type: threshold
        for: 0s
        labels:
          severity: warning
          category: application
          service: lms-backend
        annotations:
          summary: Email delivery failures
          description: More than 3 email delivery failures in the last 10 minutes
