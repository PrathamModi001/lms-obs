global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 2h
      continue: false
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      repeat_interval: 12h
      continue: false

inhibit_rules:
  - source_match:
      alertname: 'BackendDown'
    target_match:
      service: 'lms-backend'
    equal: ['instance']

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://${LOCAL_BACKEND_HOST}:${LOCAL_BACKEND_PORT}/v1/observability/alerts/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://${LOCAL_BACKEND_HOST}:${LOCAL_BACKEND_PORT}/v1/observability/alerts/webhook'
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://${LOCAL_BACKEND_HOST}:${LOCAL_BACKEND_PORT}/v1/observability/alerts/webhook'
        send_resolved: true
