global:
    scrape_interval: 15s
    evaluation_interval: 15s
    scrape_timeout: 10s

    external_labels:
        monitor: "lms-monitor"
        environment: "local"

alerting:
    alertmanagers:
        - static_configs:
              - targets:
                    - alertmanager:9093
          scheme: http
          timeout: 10s

rule_files:
    - "/etc/prometheus/alerts.yml"
    - "/etc/prometheus/alerts_comprehensive.yml"
    - "/etc/prometheus/recording_rules.yml"

scrape_configs:
    - job_name: "lms-backend"
      # App proxies 9464 internally — scrape through the app, not the raw OTel port.
      # Port 9464 binds to localhost only; not reachable from Docker.
      metrics_path: "/v1/observability/prometheus-metrics"
      scheme: http
      authorization:
          type: "ApiKey"
          credentials: "04VCjkU5TrL5biVxEnTzANj8TxJWJd4M"
      static_configs:
          - targets: ["${LOCAL_BACKEND_HOST}:${LOCAL_BACKEND_PORT}"]
            labels:
                service: "lms-backend"
                environment: "local"
                instance: "local-backend"

    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]
            labels:
                service: "prometheus"
