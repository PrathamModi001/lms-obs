# Prometheus Configuration — Staging
# Scrapes the staging backend at lmsgov.live

global:
    scrape_interval: 15s
    evaluation_interval: 15s
    scrape_timeout: 10s

    external_labels:
        monitor: "lms-monitor"
        environment: "staging"

alerting:
    alertmanagers:
        - static_configs:
              - targets:
                    - alertmanager:9093
          scheme: http
          timeout: 10s

rule_files:
    - "/etc/prometheus/alerts.yml"
    - "/etc/prometheus/alerts_comprehensive.yml"
    - "/etc/prometheus/recording_rules.yml"

scrape_configs:
    - job_name: "lms-backend"
      metrics_path: "/api/v1/observability/prometheus-metrics"

      scheme: https
      tls_config:
          insecure_skip_verify: true
      authorization:
          type: "ApiKey"
          credentials: "04VCjkU5TrL5biVxEnTzANj8TxJWJd4M"
      static_configs:
          - targets: ["lmsgov.live"]
            labels:
                service: "lms-backend"
                environment: "staging"
                instance: "staging-backend"

    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]
            labels:
                service: "prometheus"
